<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link rel="icon" href="assets/img/pokemon_go_play_game_cinema_film_movie_icon-icons.com_69163.png">
    <link rel="stylesheet" href="assets/style/style.css">
    <script src="assets/script/script.js"></script>

</head>

<body>

    <header id="header">


        <h1>Pokedex</h1>

        <h2>Gen: 1-4</h2>

        <button id="dark-mode">Dark mode</button>
    </header>

    <div class="pokedex">
        <!-- qui aggiungiamo il contenuto -->
        <main>




            <!-- passo all'inserimento del nome del pokemon da aggiungere -->
            <section>
                <p class="subtitle">Inserisci il nome del pokemon appena catturato</p>
                <form action="" id="form">
                    <label for="catturato">Pokemon catturato</label>
                    <input type="text" id="catturato" placeholder="bulbasaur...." required>
                    <button type="submit" id="button">Registra</button>
                </form>

                <div id="msg">

                </div>

            </section>



            <div class="statistiche">


                <div class="contatori">
                    <span>Catturati: <strong id="conta-catturati">0</strong></span>
                    <span>Mancanti: <strong id="conta-mancanti">0</strong></span>
                </div>

                <div class="progress">
                    <!-- Barra che cresce a ogni pokemoon registrato cattura -->
                    <div id="bar" class="progress-bar"></div>



                </div>

                <label for="tipi">Filtra per tipo: </label>
                <select name="filtro" id="tipi">
                    <option value="all">Tutti</option>
                    <option value="normal">Normale</option>
                    <option value="fire">Fuoco</option>
                    <option value="water">Acqua</option>
                    <option value="electric">Elettro</option>
                    <option value="grass">Erba</option>
                    <option value="ice">Ghiaccio</option>
                    <option value="fighting">Lotta</option>
                    <option value="poison">Veleno</option>
                    <option value="ground">Terra</option>
                    <option value="flying">Volante</option>
                    <option value="psychic">Psico</option>
                    <option value="bug">Coleottero</option>
                    <option value="rock">Roccia</option>
                    <option value="ghost">Spettro</option>
                    <option value="dragon">Drago</option>
                    <option value="dark">Buio</option>
                    <option value="steel">Acciaio</option>
                    <option value="fairy">Folletto</option>
                </select>


            </div>


            <ul id="list">
            </ul>


        </main>
    </div>

    <footer id="credits">
        <p>
            © The Pokemon Company International
        </p>
        <a href="https://pokeapi.co/">Dati dei Pokémon da PokeAPI</a>

    </footer>

</body>

</html>
